name = "southernutahvuejsmeetup"
compatibility_date = "2026-10-01"
main = "worker/index.js"
previews = { }

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/"]
not_found_handling = "single-page-application"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
