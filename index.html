<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Southern Utah Vue.js Meetup</title>
    <script>
      // Set the theme before first paint to avoid a flash. Colors mirror Vuestic's light/dark presets
      // (the light background is overridden to white in src/main.ts) and the key matches src/services/theme.ts
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = dark ? '#050A10' : '#ffffff'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
